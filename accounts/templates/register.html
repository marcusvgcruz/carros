{% extends "base.html" %}

{% block content %}
  
  <form method="post">

    {% csrf_token %}

    <div class="form-group">
        {{ user_form.username.errors }} <!-- mostrando os erros do campo username -->
        <label>Usuário</label>
        {{ user_form.username }}
    </div>

    <div class="form-group">
        {{ user_form.password1.errors }} <!-- mostrando os erros do campo password1 -->
        <label>Senha</label>
        {{ user_form.password1 }}
    </div>

    <div class="form-group">
        {{ user_form.password2.errors }} <!-- mostrando os erros do campo password2 -->
        <label>Confirmação de Senha</label>
        {{ user_form.password2 }}
    </div>

    <div class="form-group">
        <input type="submit" value="Cadastrar">
    </div>

  </form>
{% endblock %}
