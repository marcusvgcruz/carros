{% extends "base.html" %}

{% block title %}Deletar carro · Multimarcas{% endblock %}

{% block content %}

<div class="card confirm">

  <div class="confirm__icon">🗑️</div>

  <h1>Deletar carro</h1>
  <p>
    Tem certeza que deseja deletar
    <strong>{{ object.brand }} {{ object.model }}</strong>?
    Essa ação não pode ser desfeita.
  </p>

  <form method="post">
    {% csrf_token %}
    <div class="form-actions">
      <button type="submit" class="btn btn-danger">Sim, deletar</button>
      <a href="{% url 'car_update' pk=object.pk %}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>

</div>

{% endblock %}
